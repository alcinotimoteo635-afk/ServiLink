name: Backup diário da base de dados
on:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC = 03:00 em Maputo
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente PostgreSQL 17
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: pg_dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "Falta o secret DATABASE_URL"; exit 1; }
          pg_dump "$DATABASE_URL" --no-owner --schema=public -Fc -f servilink-$(date +%F).dump
      - uses: actions/upload-artifact@v4
        with:
          name: backup-servilink
          path: servilink-*.dump
          retention-days: 30
